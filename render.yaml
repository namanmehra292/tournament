services:
  - type: web
    name: badminton-tournament
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: badminton-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false # set to your Render URL after first deploy, e.g. https://badminton-tournament.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: badminton-db
    plan: starter
    databaseName: badminton
    user: badminton_app
